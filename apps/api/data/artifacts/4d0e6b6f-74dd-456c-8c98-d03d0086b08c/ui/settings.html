
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Project</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="animate-fade">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                PROJECT
            </div>
            <nav class="sidebar-menu" style="margin-top: 48px; display:flex; flex-direction:column; gap:12px;">
                <a href="landingpage.html" class="menu-item ">Landing Page</a><a href="login.html" class="menu-item ">Login</a><a href="register.html" class="menu-item ">Register</a><a href="dashboard.html" class="menu-item ">Dashboard</a><a href="settings.html" class="menu-item active">Settings</a><a href="analytics.html" class="menu-item ">Analytics</a>
            </nav>
            <div style="margin-top: auto; display: flex; align-items: center; gap: 16px;">
                <div class="avatar">U</div>
                <div style="font-size: 14px; font-weight: 700; opacity: 0.7;">User Profile</div>
            </div>
        </aside>
        <main class="app-main">
            <header class="top-bar">
                <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em;">Settings</h1>
                <div style="display: flex; gap: 20px; align-items:center;">
                    <div class="btn btn-outline" style="padding: 10px 24px; font-size:13px;">Search Command</div>
                    <div class="btn btn-primary" style="padding: 10px 24px; font-size:13px;">+ New Entry</div>
                </div>
            </header>
            <div>
                <div class="ui-container section-padding"><div class="grid-layout grid-cols-12"><div class="col-span-12 card-premium glass" style="padding: 40px;">
                <h3 style="margin-bottom: 16px; font-weight: 800; color: var(--primary);">Settings</h3>
                <p style="opacity:0.75; font-size: 16px; line-height: 1.7;"></p>
            </div></div></div><div class="ui-container section-padding"><div class="grid-layout grid-cols-12">
             <div class="col-span-12" style="margin-bottom: 24px;">
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:10px; opacity:0.5; text-transform:uppercase; letter-spacing:1px;">Full Name</label>
                <input type="text" class="input-field" placeholder="Enter Full Name..." style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 18px 24px;">
             </div>
             
             <div class="col-span-12" style="margin-bottom: 24px;">
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:10px; opacity:0.5; text-transform:uppercase; letter-spacing:1px;">Email Address</label>
                <input type="text" class="input-field" placeholder="Enter Email Address..." style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 18px 24px;">
             </div>
             
             <div class="col-span-12" style="display:flex; justify-content:flex-start; margin-top: 12px; margin-bottom: 24px;">
                <button class="btn btn-primary" style="padding: 18px 48px; font-size: 16px; min-width: 240px;">Save Changes</button>
             </div>
             </div></div><div class="ui-container section-padding"><div class="grid-layout grid-cols-12">
             <div class="col-span-12" style="margin-bottom: 24px;">
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:10px; opacity:0.5; text-transform:uppercase; letter-spacing:1px;">Notification Email</label>
                <input type="text" class="input-field" placeholder="Enter Notification Email..." style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 18px 24px;">
             </div>
             
             <div class="col-span-12" style="display:flex; justify-content:flex-start; margin-top: 12px; margin-bottom: 24px;">
                <button class="btn btn-primary" style="padding: 18px 48px; font-size: 16px; min-width: 240px;">Update Password</button>
             </div>
             </div></div>
            </div>
        </main>
    </div>
