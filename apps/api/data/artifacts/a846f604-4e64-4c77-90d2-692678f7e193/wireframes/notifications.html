
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications - Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Notifications</h1>
                    <p>Overview and management for Notifications</p>
                </div>
                <div class="nav-links">
                    <div class="col" style="width:200px;"><div class="placeholder-box" style="height:34px; min-height:34px;">[Search Bar]</div></div><div class="placeholder-box" style="width:36px; height:36px; border-radius:50%;" title="User Profile"></div>
                </div>
            </header>
            
            <div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;"><div class="section-title">New Subscription</div><div class="placeholder-box" style="height:100px;">2 minutes ago</div></div><div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;"><div class="section-title">Payment Received</div><div class="placeholder-box" style="height:100px;">1 hour ago</div></div><div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;"><div class="section-title">System Update</div><div class="placeholder-box" style="height:100px;">Yesterday</div></div>

            <footer style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p class="annotation">Flow: Navigation → Action → Confirmation | Screen: notifications</p>
            </footer>
        </div>
    </div>
</body>
</html>
