
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Visual UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ui-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Settings</h1>
                    <p>Overview and management for Settings</p>
                </div>
                <div class="nav-links">
                    <div style="flex:1; max-width:400px;"><input type="text" class="input-field" placeholder="Search..." style="margin-bottom:0;"></div><div class="avatar" title="User Profile"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User Profile" alt="avatar"></div>
                </div>
            </header>
            
            <div class="col" style="gap:6px;"><label style="font-size:13px; font-weight:600;">Display Name</label><input type="text" class="input-field" placeholder="Enter value..."></div><div class="col" style="gap:6px;"><label style="font-size:13px; font-weight:600;">Email Address</label><input type="text" class="input-field" placeholder="Enter value..."></div><div class="card col"><h4 style="font-size:16px; font-weight:600;">Privacy Settings</h4><p style="font-size:14px; color:var(--text-secondary);">Toggle visibility rules</p></div><button class="btn">Save Changes</button>
        </div>
    </div>
</body>
</html>
