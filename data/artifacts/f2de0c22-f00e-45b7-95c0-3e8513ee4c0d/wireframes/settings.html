
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Settings</h1>
                    <p>Overview and management for Settings</p>
                </div>
                <div class="nav-links">
                    <div class="col" style="width:200px;"><div class="placeholder-box" style="height:34px; min-height:34px;">[Search Bar]</div></div><div class="placeholder-box" style="width:36px; height:36px; border-radius:50%;" title="User Profile"></div>
                </div>
            </header>
            
            <div class="col"><p style="font-size: 12px; margin-bottom: 4px;">Display Name</p><div class="input-field">[Input Field]</div></div><div class="col"><p style="font-size: 12px; margin-bottom: 4px;">Email Address</p><div class="input-field">[Input Field]</div></div><div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;"><div class="section-title">Privacy Settings</div><div class="placeholder-box" style="height:100px;">Toggle visibility rules</div></div><div class="btn">Save Changes</div>

            <footer style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p class="annotation">Flow: Navigation → Action → Confirmation | Screen: settings</p>
            </footer>
        </div>
    </div>
</body>
</html>
