
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirmation Page</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px; border: 2px solid #000">
        <div class="wf-component wf-header" style="top:0; left:0; width:1440px; height:80px;"></div><div class="wf-component wf-footer" style="bottom:0; left:0; width:1440px; height:100px;"></div>
        
                <div class="wf-type-text wf-component" style="left:600px; top:120px; width:240px; height:40px;">
                    Success Message
                </div>
            
                <div class="wf-type-image wf-component" style="left:680px; top:200px; width:80px; height:80px;">
                    Checkmark or Tick Icon
                </div>
            
                <div class="wf-type-text wf-component" style="left:400px; top:320px; width:640px; height:40px;">
                    Summary of Preferences
                </div>
            
                <div class="wf-type-text wf-component" style="left:400px; top:360px; width:640px; height:20px;">
                    Name: [Name]
                </div>
            
                <div class="wf-type-text wf-component" style="left:400px; top:400px; width:640px; height:20px;">
                    Email: [Email]
                </div>
            
                <div class="wf-type-text wf-component" style="left:400px; top:440px; width:640px; height:20px;">
                    Language: [Language]
                </div>
            
                <div class="wf-type-button wf-component" style="left:640px; top:560px; width:160px; height:40px;">
                    Get Started
                </div>
            
                <div class="wf-type-text wf-component" style="left:0px; top:840px; width:1440px; height:20px;">
                    Main Dashboard or Homepage
                </div>
            
                <div class="wf-type-text wf-component" style="left:0px; top:0px; width:1440px; height:20px;">
                    Logo
                </div>
            
                <div class="wf-type-text wf-component" style="left:1360px; top:0px; width:80px; height:20px;">
                    3/3
                </div>
            
    </div>
</body>
</html>
