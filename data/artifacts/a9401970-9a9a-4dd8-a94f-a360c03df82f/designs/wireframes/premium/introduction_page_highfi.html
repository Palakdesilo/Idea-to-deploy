<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Introduction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide@1.5.0/dist/lucide.min.css" rel="stylesheet">
    <style>
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .deep-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
    <header class="glassmorphism sticky top-0 z-10 flex justify-between items-center py-4 px-6">
        <div class="flex items-center">
            <lucide-icon name="briefcase" class="text-blue-500 mr-2" size="24"></lucide-icon>
            <span class="text-lg font-bold text-blue-500">Proxima</span>
        </div>
        <span class="text-sm text-gray-500 dark:text-gray-400">1/3</span>
    </header>
    <main class="flex flex-col items-center justify-center h-screen">
        <img src="https://source.unsplash.com/1440x400/?business,productivity" alt="Product Image" class="w-full object-cover">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mt-4">Welcome to Proxima</h2>
        <button class="deep-shadow bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">Start Onboarding Process</button>
    </main>
    <footer class="glassmorphism sticky bottom-0 z-10 flex justify-center items-center py-4 px-6">
        <span class="text-sm text-gray-500 dark:text-gray-400">Skip Onboarding Process</span>
    </footer>
</body>
</html>
