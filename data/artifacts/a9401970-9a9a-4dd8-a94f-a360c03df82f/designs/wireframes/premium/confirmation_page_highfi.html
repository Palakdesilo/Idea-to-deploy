<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.4.0/dist/lucide.min.js"></script>
    <style>
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .deep-shadow {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="bg-blue-100">
    <header class="glassmorphism sticky top-0 h-20 flex justify-center items-center">
        <div class="flex justify-center items-center">
            <lucide-icon name="check" size="24" class="text-green-500 mr-2"></lucide-icon>
            <span class="text-lg font-bold text-white">Confirm</span>
        </div>
    </header>
    <main class="h-screen flex justify-center items-center">
        <div class="flex flex-col justify-center items-center">
            <img src="https://source.unsplash.com/600x200/?success,checkmark" alt="Checkmark or Success Icon" class="w-full h-48 object-cover">
            <h1 class="text-2xl font-bold text-blue-900 mt-4">Congratulations! You've completed the onboarding process.</h1>
            <p class="text-lg text-blue-700 mt-2">You've selected the following preferences: Dark Mode, English Language, and Daily Newsletter.</p>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4" onclick="window.location.href='#'">Start Using the Product</button>
            <p class="text-lg text-blue-700 mt-2"><a href="#" class="text-blue-500 hover:text-blue-700">Review or Edit Preferences</a></p>
        </div>
    </main>
    <footer class="h-20 flex justify-center items-center bg-blue-100">
        <p class="text-lg text-blue-700">&copy; 2024 Confirm. All rights reserved.</p>
    </footer>
</body>
</html>
