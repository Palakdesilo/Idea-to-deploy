<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide@1.5.0/dist/lucide.min.css" rel="stylesheet">
    <style>
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .deep-shadow {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-800">
    <header class="glassmorphism sticky top-0 z-10 h-20 flex items-center justify-between px-4 py-2">
        <div class="flex items-center">
            <i class="lucide lucide-rocket text-2xl text-blue-500 mr-2"></i>
            <span class="text-lg font-bold text-blue-500">LaunchPad</span>
        </div>
        <nav class="flex items-center space-x-4">
            <a href="#" class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500">Introduction</a>
            <a href="#" class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500">Preferences</a>
        </nav>
    </header>
    <div class="flex h-screen">
        <aside class="glassmorphism w-64 h-screen p-4 sticky top-0">
            <img src="https://source.unsplash.com/200x200/?technology,space" alt="Image" class="w-full h-full object-cover rounded-lg">
            <h2 class="text-lg font-bold text-gray-600 dark:text-gray-200 mt-4">Onboarding</h2>
            <ul class="space-y-2 mt-4">
                <li class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500"><a href="#">Introduction</a></li>
                <li class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500"><a href="#" class="text-blue-500">Preferences</a></li>
                <li class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500"><a href="#">Completion</a></li>
            </ul>
        </aside>
        <main class="flex-1 p-4">
            <h1 class="text-2xl font-bold text-gray-600 dark:text-gray-200">Preferences</h1>
            <form class="mt-4">
                <div class="flex flex-col mb-4">
                    <label for="language" class="text-sm text-gray-600 dark:text-gray-200">Language</label>
                    <select id="language" class="mt-2 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>
                <div class="flex flex-col mb-4">
                    <label for="notification" class="text-sm text-gray-600 dark:text-gray-200">Notification Settings</label>
                    <select id="notification" class="mt-2 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                        <option value="push">Push Notification</option>
                    </select>
                </div>
                <button type="submit" class="deep-shadow bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Submit Preferences</button>
            </form>
            <p class="text-sm text-gray-600 dark:text-gray-200 mt-4"><a href="#" class="text-blue-500">Go Back to Introduction Page</a></p>
        </main>
    </div>
    <footer class="glassmorphism sticky bottom-0 z-10 h-20 flex items-center justify-between px-4 py-2">
        <span class="text-sm text-gray-600 dark:text-gray-200">&copy; 2023 LaunchPad</span>
        <nav class="flex items-center space-x-4">
            <a href="#" class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500">Terms of Service</a>
            <a href="#" class="text-sm text-gray-600 dark:text-gray-200 hover:text-blue-500">Privacy Policy</a>
        </nav>
    </footer>
</body>
</html>
