<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.4.0/dist/lucide.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        .nav-menu {
            font-size: 18px;
            color: #666;
        }
        .nav-menu:hover {
            color: #3498db;
        }
        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .input-field:focus {
            border-color: #3498db;
        }
        .button {
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #2c6f9e;
        }
    </style>
</head>
<body>
    <header class="sticky top-0 bg-white shadow-xl backdrop-blur-md">
        <div class="container mx-auto p-4 flex justify-between items-center">
            <div class="logo flex items-center">
                <lucide-icon name="chart-bar" size="24" class="mr-2"></lucide-icon>
                <span class="logo">Analytix</span>
            </div>
            <nav class="nav-menu flex items-center">
                <a href="#" class="nav-menu mx-4">Login</a>
            </nav>
        </div>
    </header>
    <main class="container mx-auto p-4 mt-10">
        <div class="card">
            <h2 class="text-2xl font-bold mb-4">Registration</h2>
            <form>
                <div class="mb-4">
                    <label for="first-name" class="block text-gray-700 text-sm font-bold mb-2">First Name</label>
                    <input type="text" id="first-name" class="input-field" placeholder="John">
                </div>
                <div class="mb-4">
                    <label for="last-name" class="block text-gray-700 text-sm font-bold mb-2">Last Name</label>
                    <input type="text" id="last-name" class="input-field" placeholder="Doe">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="johndoe@example.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Password">
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
                    <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password">
                </div>
                <button type="submit" class="button">Register</button>
            </form>
        </div>
    </main>
    <footer class="bg-white shadow-xl backdrop-blur-md mt-10">
        <div class="container mx-auto p-4 flex justify-between items-center">
            <p class="text-gray-700 text-sm">&copy; 2023 Analytix. All rights reserved.</p>
            <a href="#" class="text-gray-700 text-sm">Terms and Conditions</a>
        </div>
    </footer>
    <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80" alt="Background Image" class="absolute top-0 left-0 w-full h-full object-cover">
</body>
</html>
