<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.4.0/dist/lucide.js"></script>
    <style>
        .glassmorphism {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-800">
    <header class="glassmorphism sticky top-0 z-10 h-20 flex items-center justify-between px-4 py-2">
        <div class="flex items-center">
            <lucide-icon name="lock" class="text-blue-500 mr-2" size="24"></lucide-icon>
            <span class="text-blue-500 font-bold text-lg">Secure</span>
        </div>
        <nav class="flex items-center space-x-4">
            <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-500">Home</a>
            <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-500">About</a>
            <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-500">Contact</a>
        </nav>
    </header>
    <main class="max-w-5xl mx-auto p-4 pt-6 md:p-6 lg:p-8">
        <div class="flex flex-col items-center justify-center h-screen">
            <div class="bg-white dark:bg-gray-700 shadow-xl rounded-lg p-8 w-96">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-4">Forgot Password</h2>
                <form>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 dark:text-gray-300">Email</label>
                        <input type="email" id="email" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Enter your email">
                    </div>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full">Send Password Reset Link</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="glassmorphism fixed bottom-0 left-0 w-full h-12 flex items-center justify-center px-4 py-2 text-gray-600 dark:text-gray-300">
        <span>&copy; 2023 Secure. All rights reserved.</span>
        <a href="#" class="ml-4 text-gray-600 dark:text-gray-300 hover:text-blue-500">Terms and Conditions</a>
    </footer>
</body>
</html>
