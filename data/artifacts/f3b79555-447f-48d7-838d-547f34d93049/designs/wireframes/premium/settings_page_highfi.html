<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.4.0/dist/lucide.min.js"></script>
    <style>
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .deep-shadow {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-800">
    <header class="glassmorphism sticky top-0 z-10 h-20 flex justify-between items-center px-4 py-2">
        <div class="flex items-center">
            <i class="lucide lucide-building text-2xl text-blue-500 mr-2"></i>
            <span class="text-lg font-bold text-blue-500">Constructo</span>
        </div>
        <nav class="flex items-center space-x-4">
            <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-500">Navigation Menu</a>
        </nav>
    </header>
    <main class="max-w-5xl mx-auto p-4 mt-10">
        <section class="grid grid-cols-1 gap-4">
            <div class="deep-shadow bg-white dark:bg-gray-700 p-4 rounded-lg">
                <h2 class="text-lg font-bold text-gray-600 dark:text-gray-200 mb-2">User Settings</h2>
                <form>
                    <div class="mb-4">
                        <label for="first-name" class="block text-gray-600 dark:text-gray-200 mb-2">First Name</label>
                        <input type="text" id="first-name" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="John">
                    </div>
                    <div class="mb-4">
                        <label for="last-name" class="block text-gray-600 dark:text-gray-200 mb-2">Last Name</label>
                        <input type="text" id="last-name" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Doe">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-600 dark:text-gray-200 mb-2">Email</label>
                        <input type="email" id="email" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="john.doe@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="current-password" class="block text-gray-600 dark:text-gray-200 mb-2">Current Password</label>
                        <input type="password" id="current-password" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="********">
                    </div>
                    <div class="mb-4">
                        <label for="new-password" class="block text-gray-600 dark:text-gray-200 mb-2">New Password</label>
                        <input type="password" id="new-password" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="********">
                    </div>
                    <div class="mb-4">
                        <label for="confirm-new-password" class="block text-gray-600 dark:text-gray-200 mb-2">Confirm New Password</label>
                        <input type="password" id="confirm-new-password" class="block w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="********">
                    </div>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Save Changes</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="glassmorphism fixed bottom-0 left-0 w-full h-12 flex justify-center items-center text-gray-600 dark:text-gray-300">
        <span>&copy; 2023 Constructo. All rights reserved.</span>
    </footer>
</body>
</html>
