
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px; border: 2px solid #000">

                <div class="wf-type-image wf-component" style="left:0px; top:0px; width:1440px; height:80px;">
