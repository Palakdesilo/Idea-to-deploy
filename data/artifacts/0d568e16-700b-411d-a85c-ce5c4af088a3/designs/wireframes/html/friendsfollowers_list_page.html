
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friends/Followers List Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px;">
        <div class="wf-component wf-header" style="top:0; left:0; width:1440px; height:80px;"></div>
        
                <div class="wf-type-text wf-component" style="left:16px; top:24px; width:150px; height:32px;">
                    Platform Logo/Name
                </div>
            
                <div class="wf-type-input wf-component" style="left:400px; top:24px; width:400px; height:32px;">
                    <span style="opacity:0.5">Search Bar</span>
                </div>
            
                <div class="wf-type-button wf-component" style="left:1200px; top:24px; width:32px; height:32px;">
                    Home Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1248px; top:24px; width:32px; height:32px;">
                    Notifications Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1296px; top:24px; width:32px; height:32px;">
                    Messages Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1344px; top:24px; width:32px; height:32px;">
                    Create Post Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1392px; top:24px; width:32px; height:32px;">
                    User Profile Icon
                </div>
            
                <div class="wf-type-text wf-component" style="left:320px; top:104px; width:800px; height:40px;">
                    Followers / Following
                </div>
            
                <div class="wf-type-button wf-component" style="left:320px; top:160px; width:192px; height:40px;">
                    Tab: Followers
                </div>
            
                <div class="wf-type-button wf-component" style="left:520px; top:160px; width:192px; height:40px;">
                    Tab: Following
                </div>
            
                <div class="wf-type-card wf-component" style="left:320px; top:216px; width:800px; height:80px;">
                    User Card 1
                </div>
            
                <div class="wf-type-image wf-component" style="left:336px; top:232px; width:48px; height:48px;">
                    User Profile Pic
                </div>
            
                <div class="wf-type-text wf-component" style="left:392px; top:232px; width:200px; height:24px;">
                    User Name
                </div>
            
                <div class="wf-type-text wf-component" style="left:392px; top:256px; width:150px; height:24px;">
                    User Handle
                </div>
            
                <div class="wf-type-text wf-component" style="left:552px; top:256px; width:200px; height:24px;">
                    Short Bio (Optional)
                </div>
            
                <div class="wf-type-button wf-component" style="left:1000px; top:240px; width:104px; height:32px;">
                    Follow Back
                </div>
            
                <div class="wf-type-card wf-component" style="left:320px; top:304px; width:800px; height:80px;">
                    User Card 2
                </div>
            
    </div>
</body>
</html>
