
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post Page/Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px;">
        <div class="wf-component wf-header" style="top:0; left:0; width:1440px; height:80px;"></div>
        
                <div class="wf-type-text wf-component" style="left:0px; top:0px; width:1440px; height:80px;">
                    Global Header (if Page)
                </div>
            
                <div class="wf-type-card wf-component" style="left:420px; top:120px; width:600px; height:600px;">
                    Modal/Content Block
                </div>
            
                <div class="wf-type-text wf-component" style="left:444px; top:144px; width:500px; height:32px;">
                    Create New Post
                </div>
            
                <div class="wf-type-image wf-component" style="left:980px; top:144px; width:24px; height:24px;">
                    Icon: Close (X)
                </div>
            
                <div class="wf-type-input wf-component" style="left:444px; top:192px; width:552px; height:200px;">
                    <span style="opacity:0.5">Text Area: Write your post...</span>
                </div>
            
                <div class="wf-type-image wf-component" style="left:444px; top:416px; width:32px; height:32px;">
                    Icon: Image
                </div>
            
                <div class="wf-type-image wf-component" style="left:484px; top:416px; width:32px; height:32px;">
                    Icon: Video
                </div>
            
                <div class="wf-type-input wf-component" style="left:444px; top:464px; width:552px; height:48px;">
                    <span style="opacity:0.5">Input: Location Tag (Optional)</span>
                </div>
            
                <div class="wf-type-input wf-component" style="left:444px; top:528px; width:552px; height:48px;">
                    <span style="opacity:0.5">Dropdown: Privacy Settings (Optional)</span>
                </div>
            
                <div class="wf-type-button wf-component" style="left:756px; top:600px; width:240px; height:56px;">
                    Cancel
                </div>
            
                <div class="wf-type-button wf-component" style="left:444px; top:600px; width:240px; height:56px;">
                    Post
                </div>
            
    </div>
</body>
</html>
