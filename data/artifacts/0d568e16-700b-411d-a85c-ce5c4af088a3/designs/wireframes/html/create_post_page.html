
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px;">
        <div class="wf-component wf-header" style="top:0; left:0; width:1440px; height:80px;"></div>
        
                <div class="wf-type-text wf-component" style="left:16px; top:24px; width:150px; height:32px;">
                    Platform Logo/Name
                </div>
            
                <div class="wf-type-input wf-component" style="left:400px; top:24px; width:400px; height:32px;">
                    <span style="opacity:0.5">Search Bar</span>
                </div>
            
                <div class="wf-type-button wf-component" style="left:1200px; top:24px; width:32px; height:32px;">
                    Home Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1248px; top:24px; width:32px; height:32px;">
                    Notifications Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1296px; top:24px; width:32px; height:32px;">
                    Messages Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1344px; top:24px; width:32px; height:32px;">
                    Create Post Icon
                </div>
            
                <div class="wf-type-button wf-component" style="left:1392px; top:24px; width:32px; height:32px;">
                    User Profile Icon
                </div>
            
                <div class="wf-type-text wf-component" style="left:420px; top:120px; width:600px; height:40px;">
                    Create New Post
                </div>
            
                <div class="wf-type-input wf-component" style="left:420px; top:184px; width:600px; height:200px;">
                    <span style="opacity:0.5">Text Area: Write your post...</span>
                </div>
            
                <div class="wf-type-button wf-component" style="left:420px; top:400px; width:100px; height:40px;">
                    Image
                </div>
            
                <div class="wf-type-button wf-component" style="left:536px; top:400px; width:100px; height:40px;">
                    Video
                </div>
            
                <div class="wf-type-input wf-component" style="left:420px; top:456px; width:600px; height:40px;">
                    <span style="opacity:0.5">Location Tag (Optional)</span>
                </div>
            
                <div class="wf-type-input wf-component" style="left:420px; top:504px; width:600px; height:40px;">
                    <span style="opacity:0.5">Privacy Settings (Dropdown)</span>
                </div>
            
                <div class="wf-type-button wf-component" style="left:892px; top:560px; width:128px; height:48px;">
                    Post
                </div>
            
                <div class="wf-type-button wf-component" style="left:756px; top:560px; width:128px; height:48px;">
                    Cancel
                </div>
            
    </div>
</body>
</html>
