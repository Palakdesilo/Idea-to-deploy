
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px;">
        
        
                <div class="wf-type-text wf-component" style="left:520px; top:120px; width:400px; height:48px;">
                    Platform Logo/Name
                </div>
            
                <div class="wf-type-input wf-component" style="left:520px; top:192px; width:400px; height:40px;">
                    <span style="opacity:0.5">Full Name</span>
                </div>
            
                <div class="wf-type-input wf-component" style="left:520px; top:240px; width:400px; height:40px;">
                    <span style="opacity:0.5">Username</span>
                </div>
            
                <div class="wf-type-input wf-component" style="left:520px; top:288px; width:400px; height:40px;">

                </div>

                </div>
            
                <div class="wf-type-input wf-component" style="left:520px; top:384px; width:400px; height:40px;">
                    <span style="opacity:0.5">Confirm Password</span>
                </div>
            
                <div class="wf-type-text wf-component" style="left:520px; top:432px; width:400px; height:24px;">
                    Checkbox: Agree to Terms and Conditions (Link)
                </div>
            
                <div class="wf-type-button wf-component" style="left:520px; top:472px; width:400px; height:48px;">
                    Sign Up
                </div>
            
                <div class="wf-type-text wf-component" style="left:520px; top:536px; width:400px; height:24px;">

                </div>
            
    </div>

</html>
