
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Visual UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ui-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>User Dashboard</h1>
                    <p>Main control center</p>
                </div>
                <div class="nav-links">
                    <div style="flex:1; max-width:400px;"><input type="text" class="input-field" placeholder="Search..." style="margin-bottom:0;"></div><div class="avatar" title="User"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="avatar"></div>
                </div>
            </header>
            
            
                <div class="flex">
                    <div class="sidebar col">
                        <div style="font-size:12px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Menu</div>
                        <a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">Home</a><a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">User Dashboard</a>
                    </div>
                    <div class="flex-1 col">
                        <div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-3" style="margin-bottom:32px;">
                        <div class="card col">
                            <span style="font-size:12px; color:var(--text-secondary); font-weight:600;">Core Metric</span>
                            <span style="font-size:24px; font-weight:700;">$0.00</span>
                            <span style="font-size:12px; color:#10b981;">+0.0% from last month</span>
                        </div>
                    
                        <div class="card col">
                            <span style="font-size:12px; color:var(--text-secondary); font-weight:600;">Secondary</span>
                            <span style="font-size:24px; font-weight:700;">$0.00</span>
                            <span style="font-size:12px; color:#10b981;">+0.0% from last month</span>
                        </div>
                    
                        <div class="card col">
                            <span style="font-size:12px; color:var(--text-secondary); font-weight:600;">Growth</span>
                            <span style="font-size:24px; font-weight:700;">$0.00</span>
                            <span style="font-size:12px; color:#10b981;">+0.0% from last month</span>
                        </div>
                    </div><div class="grid grid-2" style="gap: 20px;">
                        <div class="col" style="margin-top:24px;">
                            <h3 style="font-size:18px; margin-bottom:8px;">Recent Activity</h3>
                            <div class="card" style="padding:0; overflow:hidden;">
                                <table>
                                    <thead>
                                        <tr><th>Item</th><th>Status</th><th>Date</th><th>Amount</th></tr>
                                    </thead>
                                    <tbody>
                                        <tr><td>Example Row 1</td><td><span style="padding:4px 8px; border-radius:12px; background:#fef3c7; color:#92400e; font-size:11px; font-weight:700;">PENDING</span></td><td>Dec 30, 2025</td><td>$240.00</td></tr>
                                        <tr><td>Example Row 2</td><td><span style="padding:4px 8px; border-radius:12px; background:#dcfce7; color:#166534; font-size:11px; font-weight:700;">COMPLETED</span></td><td>Dec 29, 2025</td><td>$1,200.00</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            
        </div>
    </div>
</body>
</html>
