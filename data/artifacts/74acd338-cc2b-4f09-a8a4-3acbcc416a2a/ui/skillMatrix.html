
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Matrix - Visual UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ui-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Skill Matrix</h1>
                    <p>Technical and soft skills</p>
                </div>
                <div class="nav-links">
                    <div style="flex:1; max-width:400px;"><input type="text" class="input-field" placeholder="Search..." style="margin-bottom:0;"></div><div class="avatar" title="User"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="avatar"></div>
                </div>
            </header>
            
            
                <div class="flex">
                    <div class="sidebar col">
                        <div style="font-size:12px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Menu</div>
                        <a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">Home</a><a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">Skill Matrix</a>
                    </div>
                    <div class="flex-1 col">
                        <div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;">
                        <div style="display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:white; border:1px solid var(--border-color); border-radius:30px; margin-right:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); transition: transform 0.2s; cursor:default;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                            <div style="width:10px; height:10px; border-radius:50%; background:var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
                            <span style="font-size:14px; font-weight:600; color:var(--text-primary);">Python</span>
                        </div>
                    
                        <div style="display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:white; border:1px solid var(--border-color); border-radius:30px; margin-right:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); transition: transform 0.2s; cursor:default;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                            <div style="width:10px; height:10px; border-radius:50%; background:var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
                            <span style="font-size:14px; font-weight:600; color:var(--text-primary);">Next.js</span>
                        </div>
                    
                        <div style="display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:white; border:1px solid var(--border-color); border-radius:30px; margin-right:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); transition: transform 0.2s; cursor:default;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                            <div style="width:10px; height:10px; border-radius:50%; background:var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
                            <span style="font-size:14px; font-weight:600; color:var(--text-primary);">UI Design</span>
                        </div>
                    
                        <div style="display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:white; border:1px solid var(--border-color); border-radius:30px; margin-right:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); transition: transform 0.2s; cursor:default;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                            <div style="width:10px; height:10px; border-radius:50%; background:var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
                            <span style="font-size:14px; font-weight:600; color:var(--text-primary);">Cloud Arch</span>
                        </div>
                    </div>
                    </div>
                </div>
            
        </div>
    </div>
</body>
</html>
