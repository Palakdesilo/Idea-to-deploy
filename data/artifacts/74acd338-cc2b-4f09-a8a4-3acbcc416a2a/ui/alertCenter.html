
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alert Center - Visual UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ui-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Alert Center</h1>
                    <p>All notifications</p>
                </div>
                <div class="nav-links">
                    <div style="flex:1; max-width:400px;"><input type="text" class="input-field" placeholder="Search..." style="margin-bottom:0;"></div><div class="avatar" title="User"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="avatar"></div>
                </div>
            </header>
            
            
                <div class="flex">
                    <div class="sidebar col">
                        <div style="font-size:12px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Menu</div>
                        <a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">Home</a><a href="#" class="btn" style="border:none; justify-content:flex-start; width:100%;">Alert Center</a>
                    </div>
                    <div class="flex-1 col">
                        <div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;">
                        <div class="card col" style="padding: 24px; border-top: 4px solid var(--primary); transition: box-shadow 0.3s;">
                            <div class="flex" style="align-items: center; gap: 12px; margin-bottom: 12px;">
                                <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(79, 70, 229, 0.1); display: flex; align-items: center; justify-content: center; color: var(--primary);">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </div>
                                <h4 style="font-size: 17px; font-weight: 700;">Alert Center Content</h4>
                            </div>
                            <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.5;">Main workspace area</p>
                            <div class="flex" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9; gap: 12px; font-size: 12px; color: var(--text-secondary);">
                                <span>Updated: Dec 30</span>
                                <span>•</span>
                                <span style="color: var(--primary); font-weight: 600; cursor: pointer;">View Details →</span>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            
        </div>
    </div>
</body>
</html>
