
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings - Visual UI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ui-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">

                </div>
                <div class="nav-links">

                </div>
            </header>
            
            
                <div class="flex">
                    <div class="sidebar col">
                        <div style="font-size:12px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Menu</div>

                    </div>
                    <div class="flex-1 col">
                        <div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;"></div><div class="grid grid-2" style="gap: 20px;"><div class="col" style="gap:6px;"><label style="font-size:13px; font-weight:600;">Display Info</label><input type="text" class="input-field" placeholder="Enter value..."></div><button class="btn">Save Preferences</button></div>
                    </div>
                </div>
            
        </div>
    </div>
