
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alert Center - Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Alert Center</h1>
                    <p>All notifications</p>
                </div>
                <div class="nav-links">
                    <div class="col" style="width:200px;"><div class="placeholder-box" style="height:34px; min-height:34px;">[Search Bar]</div></div><div class="placeholder-box" style="width:36px; height:36px; border-radius:50%;" title="User"></div>
                </div>
            </header>
            
            <div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;"><div class="section-title">Alert Center Content</div><div class="placeholder-box" style="height:100px;">Main workspace area</div></div>

            <footer style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p class="annotation">Flow: Standard flow | Screen: alertCenter</p>
            </footer>
        </div>
    </div>
</body>
</html>
