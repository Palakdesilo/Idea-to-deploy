
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings - Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>Account Settings</h1>
                    <p>Profile management</p>
                </div>
                <div class="nav-links">
                    <div class="col" style="width:200px;"><div class="placeholder-box" style="height:34px; min-height:34px;">[Search Bar]</div></div><div class="placeholder-box" style="width:36px; height:36px; border-radius:50%;" title="User"></div>
                </div>
            </header>
            
            <div class="col"><p style="font-size: 12px; margin-bottom: 4px;">Display Info</p><div class="input-field">[Input Field]</div></div><div class="btn">Save Preferences</div>

            <footer style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p class="annotation">Flow: Standard flow | Screen: accountSettings</p>
            </footer>
        </div>
    </div>
</body>
</html>
