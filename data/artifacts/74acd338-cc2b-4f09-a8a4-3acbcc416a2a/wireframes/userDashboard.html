
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="screen-card">
            <header>
                <div class="screen-info">
                    <h1>User Dashboard</h1>
                    <p>Main control center</p>
                </div>
                <div class="nav-links">
                    <div class="col" style="width:200px;"><div class="placeholder-box" style="height:34px; min-height:34px;">[Search Bar]</div></div><div class="placeholder-box" style="width:36px; height:36px; border-radius:50%;" title="User"></div>
                </div>
            </header>
            
            
                <div class="flex">
                    <div class="col sidebar">
                        <div class="section-title">Sidebar</div>
                        <div class="btn" style="text-align:left;">Home</div><div class="btn" style="text-align:left;">User Dashboard</div>
                    </div>
                    <div class="col flex-1">
                        <div class="grid grid-3">
                        <div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;">
                            <div class="section-title">Stat Card</div>
                            <div class="placeholder-box" style="height: 60px; font-size: 20px;">[Value]</div>
                            <p class="annotation">Core Metric</p>
                        </div>
                    
                        <div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;">
                            <div class="section-title">Stat Card</div>
                            <div class="placeholder-box" style="height: 60px; font-size: 20px;">[Value]</div>
                            <p class="annotation">Secondary</p>
                        </div>
                    
                        <div class="col" style="border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;">
                            <div class="section-title">Stat Card</div>
                            <div class="placeholder-box" style="height: 60px; font-size: 20px;">[Value]</div>
                            <p class="annotation">Growth</p>
                        </div>
                    </div>
                        <div class="col">
                            <div class="section-title">Recent Activity</div>
                            <table>
                                <thead>
                                    <tr><th>Post</th><th>Type</th><th>Status</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    <tr><td>Row 1</td><td>Free</td><td>Active</td><td><span style="text-decoration:underline;">View</span></td></tr>
                                    <tr><td>Row 2</td><td>Paid</td><td>Draft</td><td><span style="text-decoration:underline;">Edit</span></td></tr>
                                </tbody>
                            </table>
                        </div>
                    
                    </div>
                </div>
            

            <footer style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p class="annotation">Flow: Standard flow | Screen: userDashboard</p>
            </footer>
        </div>
    </div>
</body>
</html>
