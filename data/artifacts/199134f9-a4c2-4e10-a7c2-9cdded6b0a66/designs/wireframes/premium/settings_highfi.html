<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.6.0/dist/lucide.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(to bottom, #f7f7f7, #ffffff);
            background-size: 100% 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .glassmorphism {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.24);
            border-radius: 10px;
            box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header class="glassmorphism sticky top-0 z-10 flex items-center justify-between py-4 pl-4 pr-8 bg-white/20">
        <div class="flex items-center space-x-4">
            <img src="https://source.unsplash.com/64x64/?logo" alt="Logo" class="rounded-full">
            <span class="text-lg font-medium text-gray-800">Application Name</span>
        </div>
        <div class="flex items-center space-x-4">
            <input type="search" id="search" placeholder="Search" class="w-80 py-2 pl-10 text-sm text-gray-700 rounded-lg focus:outline-none focus:ring-indigo-600 focus:ring-2">
            <button class="p-2 text-gray-700 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-indigo-600 focus:ring-2">
                <lucide-search class="w-5 h-5"></lucide-search>
            </button>
            <button class="p-2 text-gray-700 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-indigo-600 focus:ring-2">
                <lucide-bell class="w-5 h-5"></lucide-bell>
            </button>
        </div>
    </header>
    <main class="container mx-auto p-4 pt-6 mt-10">
        <nav class="flex items-center space-x-4 mb-4">
            <span class="text-sm text-gray-600">Breadcrumbs</span>
            <span class="text-sm text-gray-600">/</span>
            <span class="text-sm text-gray-800">Current Page</span>
        </nav>
        <div class="grid grid-cols-1 gap-4">
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <label for="setting-1" class="block text-sm font-medium text-gray-700">Setting 1</label>
                <input type="text" id="setting-1" placeholder="Setting 1" class="block w-full py-2 pl-10 text-sm text-gray-700 rounded-lg focus:outline-none focus:ring-indigo-600 focus:ring-2">
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <label for="setting-2" class="block text-sm font-medium text-gray-700">Setting 2</label>
                <input type="text" id="setting-2" placeholder="Setting 2" class="block w-full py-2 pl-10 text-sm text-gray-700 rounded-lg focus:outline-none focus:ring-indigo-600 focus:ring-2">
            </div>
            <button class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-lg py-2 px-4 hover:from-indigo-700 hover:to-violet-700 focus:outline-none focus:ring-indigo-600 focus:ring-2">Save Settings</button>
        </div>
    </main>
</body>
</html>
