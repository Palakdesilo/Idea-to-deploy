<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide@1.5.0/dist/lucide.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(to bottom, #f7f7f7, #ffffff);
            background-size: 100% 100%;
        }
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header class="h-20 glassmorphism sticky top-0 z-10 flex items-center justify-between px-4 py-2">
        <div class="flex items-center justify-start">
            <img src="https://source.unsplash.com/64x64/?logo" alt="Logo" class="w-16 h-16 rounded-full">
            <h1 class="ml-4 text-2xl font-bold text-indigo-600">Application Name</h1>
        </div>
        <div class="flex items-center justify-end">
            <input type="search" placeholder="Search" class="w-80 h-10 pl-4 pr-10 text-sm text-gray-700 border border-gray-200 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
            <button class="ml-4 w-10 h-10 p-2 text-gray-700 border border-gray-200 rounded-lg hover:bg-indigo-500 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <button class="ml-4 w-10 h-10 p-2 text-gray-700 border border-gray-200 rounded-lg hover:bg-indigo-500 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.502 6.502 0 00-3.094-5.08c-.34-.866-.87-1.516-1.5-2.106C12.716 4.457 11.876 4 11 4c-4.412 0-8 3.588-8 8s3.588 8 8 8c1.054 0 2.094-.276 3.022-.75 2.12-1.18 3.755-2.8 4.493-4.547A4.08 4.08 0 0115 17z"></path></svg>
            </button>
        </div>
    </header>
    <div class="flex h-screen">
        <aside class="w-64 h-screen p-4 bg-white border-r border-gray-200">
            <nav class="flex flex-col">
                <a href="#" class="py-2 text-gray-700 hover:text-indigo-500">Dashboard</a>
                <a href="#" class="py-2 text-gray-700 hover:text-indigo-500">Users</a>
                <a href="#" class="py-2 text-gray-700 hover:text-indigo-500">Settings</a>
            </nav>
        </aside>
        <main class="flex-1 p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-indigo-600">Breadcrumbs</h2>
                <h2 class="text-2xl font-bold text-indigo-600">Current Page</h2>
            </div>
            <table class="w-full table-auto border border-gray-200 rounded-lg">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 text-gray-700">Name</th>
                        <th class="px-4 py-2 text-gray-700">Email</th>
                        <th class="px-4 py-2 text-gray-700">Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="px-4 py-2 text-gray-700">John Doe</td>
                        <td class="px-4 py-2 text-gray-700">john@example.com</td>
                        <td class="px-4 py-2 text-gray-700">Admin</td>
                    </tr>
                    <tr>
                        <td class="px-4 py-2 text-gray-700">Jane Doe</td>
                        <td class="px-4 py-2 text-gray-700">jane@example.com</td>
                        <td class="px-4 py-2 text-gray-700">User</td>
                    </tr>
                </tbody>
            </table>
            <button class="mt-4 w-full h-10 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-lg hover:from-indigo-500 hover:to-violet-500">Create New User</button>
        </main>
    </div>
</body>
</html>
