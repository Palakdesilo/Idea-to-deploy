<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.6.0/dist/lucide.js" integrity="sha256-0u0X1W+0wv1Hx5jxh2p1Gz1OZ3mVWv7h3R7Tz2xtuQ=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(to bottom, #3a3d41, #333);
            background-size: cover;
            background-attachment: fixed;
        }
        .glassmorphism {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0px 4px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header class="h-20 glassmorphism w-full flex justify-between items-center px-8 fixed top-0 left-0 z-10">
        <div class="flex items-center">
            <img src="https://source.unsplash.com/64x64/?logo" alt="Logo" class="w-16 h-16 rounded-full object-cover">
            <h1 class="text-2xl font-bold text-white ml-4">Application Name</h1>
        </div>
        <div class="flex items-center">
            <input type="search" placeholder="Search" class="w-80 h-10 pl-4 pr-10 text-sm text-gray-700 rounded-lg border border-gray-300">
            <button class="w-10 h-10 ml-2 rounded-full bg-indigo-600 hover:bg-violet-600 text-white flex justify-center items-center">
                <lucide-search size="20" />
            </button>
            <button class="w-10 h-10 ml-2 rounded-full bg-indigo-600 hover:bg-violet-600 text-white flex justify-center items-center">
                <lucide-bell size="20" />
            </button>
        </div>
    </header>
    <div class="flex h-screen w-full mt-20">
        <aside class="w-64 h-full bg-gray-800 p-4 fixed left-0 top-20 z-0">
            <nav>
                <ul>
                    <li class="text-white mb-4">
                        <a href="#" class="text-lg font-bold">Breadcrumbs</a>
                    </li>
                    <li class="text-white mb-4">
                        <a href="#" class="text-lg font-bold">Current Page</a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="w-full h-full ml-64 p-4 overflow-y-auto">
            <section class="bg-white rounded-lg shadow-lg p-4 mb-4">
                <h2 class="text-lg font-bold mb-2">Notifications</h2>
                <table class="w-full table-auto border border-gray-300 rounded-lg">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-2 text-left text-sm font-bold text-gray-600">Notification</th>
                            <th class="px-4 py-2 text-left text-sm font-bold text-gray-600">Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">You have a new message from John Doe</td>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">2023-03-01 12:00:00</td>
                        </tr>
                        <tr>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">You have a new comment on your post</td>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">2023-03-01 13:00:00</td>
                        </tr>
                        <tr>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">You have a new follower</td>
                            <td class="px-4 py-2 text-left text-sm text-gray-600">2023-03-01 14:00:00</td>
                        </tr>
                    </tbody>
                </table>
                <button class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-2 px-4 rounded-lg w-full mt-4">
                    Mark as Read
                </button>
            </section>
        </main>
    </div>
</body>
</html>
