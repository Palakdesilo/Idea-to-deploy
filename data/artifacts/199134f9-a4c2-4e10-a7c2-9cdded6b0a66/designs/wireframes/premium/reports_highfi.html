<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.2.4/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@1.7.1/dist/lucide.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(to bottom, #111111, #222222);
            background-size: cover;
            background-attachment: fixed;
        }
        .glassmorphism {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 17, 17, 0.75);
            border-radius: 12px;
            border: 1px solid rgba(209, 213, 219, 0.3);
        }
    </style>
</head>
<body>
    <header class="glassmorphism sticky top-0 z-10 flex items-center justify-between p-4">
        <div class="flex items-center">
            <img src="https://source.unsplash.com/64x64/?logo" alt="Logo" class="mr-4">
            <h1 class="text-lg font-bold text-white">Application Name</h1>
        </div>
        <div class="flex items-center">
            <input type="search" placeholder="Search" class="p-2 pl-10 text-sm text-gray-700 bg-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-600 w-80">
            <button class="ml-2 p-2 text-sm text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 rounded-lg">
                <i class="fi fi-br-search"></i>
            </button>
            <button class="ml-2 p-2 text-sm text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 rounded-lg">
                <i class="fi fi-br-bell"></i>
            </button>
        </div>
    </header>
    <div class="flex h-screen">
        <aside class="w-64 p-4 bg-gray-200">
            <nav>
                <ul>
                    <li class="mb-4">
                        <a href="#" class="text-sm text-gray-700 hover:text-gray-900">Dashboard</a>
                    </li>
                    <li class="mb-4">
                        <a href="#" class="text-sm text-gray-700 hover:text-gray-900">Reports</a>
                    </li>
                    <li class="mb-4">
                        <a href="#" class="text-sm text-gray-700 hover:text-gray-900">Settings</a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="flex-1 p-4">
            <div class="mb-4">
                <h2 class="text-lg font-bold text-white">Breadcrumbs</h2>
                <h2 class="text-lg font-bold text-white">Current Page</h2>
            </div>
            <table class="w-full table-auto border border-gray-200 rounded-lg">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="px-4 py-2 text-sm text-gray-700">Column 1</th>
                        <th class="px-4 py-2 text-sm text-gray-700">Column 2</th>
                        <th class="px-4 py-2 text-sm text-gray-700">Column 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-gray-200">
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 1</td>
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 2</td>
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 3</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 4</td>
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 5</td>
                        <td class="px-4 py-2 text-sm text-gray-700">Cell 6</td>
                    </tr>
                </tbody>
            </table>
            <button class="w-full mt-4 p-2 text-sm text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 rounded-lg">
                Create New Report
            </button>
        </main>
    </div>
</body>
</html>
