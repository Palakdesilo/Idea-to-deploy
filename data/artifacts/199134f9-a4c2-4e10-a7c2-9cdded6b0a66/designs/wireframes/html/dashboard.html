
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wireframe-canvas" style="width:1440px; height:900px; border: 2px solid #000">
        <div class="wf-component wf-header" style="top:0; left:0; width:1440px; height:80px;"></div><div class="wf-component wf-sidebar" style="top:80px; left:0; width:250px; height:820px;"></div>
        
                <div class="wf-type-text wf-component" style="left:0px; top:0px; width:1440px; height:80px;">
                    Header
                </div>
            
                <div class="wf-type-text wf-component" style="left:0px; top:80px; width:250px; height:820px;">
                    Sidebar
                </div>
            
                <div class="wf-type-table wf-component" style="left:250px; top:80px; width:1190px; height:400px;">
                    Grid
                </div>
            
                <div class="wf-type-card wf-component" style="left:250px; top:480px; width:590px; height:200px;">

                </div>
            
                <div class="wf-type-card wf-component" style="left:840px; top:480px; width:590px; height:200px;">

                </div>

</html>
