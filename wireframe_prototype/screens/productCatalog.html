<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog / Search Results Screen - Wireframe</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="twoColumn">
    <div class="layout-container">
        <nav class="top-nav">
            <a href="../index.html">← All Screens</a>
            <div class="info">Public | /products</div>
        </nav>
        <main class="main-content">
            <h1>Product Catalog / Search Results Screen</h1>

            <div class="section">
                <div class="section-title">Header</div>
                <div class="component-box">GlobalHeader</div>
            </div>

            <div class="content-wrapper">
                <aside class="sidebar-side">
                    <div class="section">
                        <div class="section-title">Sidebar</div>
                        <div class="component-box">
                            FilterSidebar
                            <div class="component-includes">Includes: Categories, PriceRange</div>
                        </div>
                    </div>
                </aside>

                <div class="main-side">
                    <div class="section">
                        <div class="section-title">Main Content</div>
                        <div class="component-box">
                            ProductGrid
                            <div class="component-includes">Includes: Image, Title, Price</div>
                        </div>
                        <div class="component-box">PaginationControls</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Footer</div>
                <div class="component-box">GlobalFooter</div>
            </div>
        </main>
    </div>
</body>

</html>
