<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail Screen - Wireframe</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="fullPage">
    <div class="layout-container">
        <nav class="top-nav">
            <a href="../index.html">← All Screens</a>
            <div class="info">Public | /products/:id</div>
        </nav>
        <main class="main-content">
            <h1>Product Detail Screen</h1>
            <div class="section">
                <div class="section-title">Header</div>
                <div class="component-box">GlobalHeader</div>
            </div>
            <div class="section">
                <div class="section-title">Product Display</div>
                <div class="component-box">ProductGallery</div>
                <div class="component-box">
                    ProductInfo
                    <div class="component-includes">Includes: Title, Price, Description</div>
                </div>
                <div class="component-box">AddToCartButton</div>
            </div>
            <div class="section">
                <div class="section-title">Reviews</div>
                <div class="component-box">ReviewsSection</div>
            </div>
            <div class="section">
                <div class="section-title">Footer</div>
                <div class="component-box">GlobalFooter</div>
            </div>
        </main>
    </div>
</body>

</html>
