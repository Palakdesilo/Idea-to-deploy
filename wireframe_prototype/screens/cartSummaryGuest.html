<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Summary Screen (Guest) - Wireframe</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="fullPage">
    <div class="layout-container">
        <nav class="top-nav">
            <a href="../index.html">← All Screens</a>
            <div class="info">Public | /cart</div>
        </nav>
        <main class="main-content">
            <h1>Cart Summary Screen (Guest)</h1>
            <div class="section">
                <div class="section-title">Header</div>
                <div class="component-box">GlobalHeader</div>
            </div>
            <div class="section">
                <div class="section-title">Cart Items</div>
                <div class="component-box">
                    CartItemList
                    <div class="component-includes">Includes: Image, Name, Price, Qty</div>
                </div>
            </div>
            <div class="section">
                <div class="section-title">Order Summary</div>
                <div class="component-box">
                    OrderSummary
                    <div class="component-includes">Includes: Subtotal, EstTax, EstShipping</div>
                </div>
                <div class="component-box">CheckoutCTAButton</div>
            </div>
            <div class="section">
                <div class="section-title">Footer</div>
                <div class="component-box">GlobalFooter</div>
            </div>
        </main>
    </div>
</body>

</html>
